<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Inscrição recebida · [Marca]</title>
  <link rel="icon" href="/minha-lp/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --fundo: #f4f5f7; --cartao: #ffffff; --texto: #1c1f26; --texto-suave: #5b6170;
      --destaque: #0a57d0; --zap: #128c4a; --borda: #e2e5ea; --raio: 10px;
      --fonte: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--fundo); color: var(--texto); font: 400 17px/1.6 var(--fonte); }
    .cartao { width: 100%; max-width: 560px; background: var(--cartao); border: 1px solid var(--borda);
      border-radius: var(--raio); padding: 36px 28px; text-align: center; }
    .icone { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%; background: var(--destaque);
      color: #fff; display: grid; place-items: center; font-size: 28px; font-weight: 800; }
    h1 { font-size: clamp(26px, 6vw, 34px); line-height: 1.2; margin: 0 0 12px; }
    p { margin: 0 0 14px; color: var(--texto-suave); }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 14px 28px;
      margin-top: 8px; border-radius: var(--raio); background: var(--zap); color: #fff; font-weight: 600; text-decoration: none; }
    @media (max-width: 599px) { .btn { width: 100%; } }
  </style>
</head>
<body>
  <main class="cartao">
    <div class="icone" aria-hidden="true">✓</div>
    <h1 id="titulo">Inscrição recebida!</h1>
    <p>[Próximo passo concreto. Ex.: você vai receber uma mensagem no WhatsApp em até 1 hora com os detalhes.]</p>
    <!-- Botão de WhatsApp opcional: troque o número (55 + DDD + número) ou apague o bloco. -->
    <a class="btn" id="zap" href="https://wa.me/5500000000000">Falar no WhatsApp agora</a>
  </main>
  <script>
  (function () {
    var p = new URLSearchParams(location.search);
    var nome = p.get('nome') || '';
    // Nome com acento pode chegar codificado duas vezes (%25C3%25A9): decodifica até estabilizar.
    for (var i = 0; i < 2 && /%[0-9a-f]{2}/i.test(nome); i++) {
      try { nome = decodeURIComponent(nome); } catch (e) { break; }
    }
    nome = nome.replace(/[<>]/g, '').trim().split(/\s+/)[0] || '';
    if (nome) {
      nome = nome.charAt(0).toUpperCase() + nome.slice(1).toLowerCase();
      document.getElementById('titulo').textContent = 'Inscrição recebida, ' + nome + '!';
    }
    var zap = document.getElementById('zap');
    if (zap) {
      var msg = 'Oi! ' + (nome ? 'Me chamo ' + nome + ' e ' : '') + 'acabei de me inscrever pela página. [Complete a mensagem.]';
      zap.href = zap.href.split('?')[0] + '?text=' + encodeURIComponent(msg);
    }
  })();
  </script>
</body>
</html>
